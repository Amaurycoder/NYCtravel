<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Phosphor Icons -->

    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.svg">
    <script>
        if ('serviceWorker' in navigator) {

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            overscroll-behavior-y: none;
        }

        /* --- 2026 Glassmorphism Utilities --- */
        .glass-panel {
            background: rgba(20, 20, 25, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-pill {
            background: rgba(30, 30, 35, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- Map Adjustments --- */
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Glassmorphic Leaflet Popups */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 25, 0.75) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 16px !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6) !important;
        }

        .leaflet-popup-tip {
            background: rgba(20, 20, 25, 0.75) !important;
            backdrop-filter: blur(20px) !important;
        }

        .leaflet-popup-content {
            margin: 16px !important;
        }

        .leaflet-popup-close-button {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        /* Timeline connecting line */
        .timeline-track {
            position: absolute;
            left: 23px;
            top: 40px;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.05) 100%);
            z-index: -1;
        }

        /* Sparkle Animation for AI Button */
        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .btn-ai {
            background: linear-gradient(270deg, rgba(79, 70, 229, 0.2), rgba(236, 72, 153, 0.2), rgba(79, 70, 229, 0.2));
            background-size: 200% 200%;
            animation: shimmer 4s ease infinite;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .btn-ai:hover {
            background: linear-gradient(270deg, rgba(79, 70, 229, 0.4), rgba(236, 72, 153, 0.4), rgba(79, 70, 229, 0.4));
            background-size: 200% 200%;
        }

        /* Modal Styles */
        .modal-transition {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .modal-content-anim {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-hidden .modal-content-anim {
            transform: scale(0.95) translateY(20px);
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }

        .markdown-body strong {
            color: #f472b6;
        }

        /* Remove arrows from number inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="relative text-sm text-gray-200">

    <!-- The Map (Full Screen) -->

            </div>
        </header>

        <div class="flex-1 pointer-events-none"></div>

        <!-- Floating Timeline Panel -->

            </div>

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([40.7580, -73.9855], 12);

            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = isDark ? 'dark_all' : 'light_all';

            // Carto (Auto Theme)
            const tileLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${theme}/{z}/{x}/{y}{r}.png`, {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                    const newTheme = event.matches ? 'dark_all' : 'light_all';
                    tileLayer.setUrl(`https://{s}.basemaps.cartocdn.com/${newTheme}/{z}/{x}/{y}{r}.png`);
                });
            }

            // Location Control Button
            const locationControl = L.control({ position: 'bottomright' });
            locationControl.onAdd = function () {
                const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                div.innerHTML = `<a href="#" title="Ma position" class="text-blue-400 flex items-center justify-center transition-colors border-none shadow-xl rounded-lg" style="width: 40px; height: 40px; background: rgba(30,30,40,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2) !important; color: #60a5fa;" onclick="event.preventDefault(); locateUser();"><i class="ph ph-crosshair text-2xl z-20"></i></a>`;
                return div;
            };
            locationControl.addTo(map);

            userLocationMarker = L.circleMarker([-1000, -1000], {
                radius: 8,
                fillColor: "#3b82f6",
                color: "#ffffff",
                weight: 3,
                opacity: 1,
                fillOpacity: 1
            });

            markersGroup = L.featureGroup().addTo(map);
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.flyTo([lat, lng], 15, { animate: true, duration: 1.5 });
                    userLocationMarker.setLatLng([lat, lng]);
                    if (!map.hasLayer(userLocationMarker)) {
                        userLocationMarker.addTo(map);
                    }
                },
                () => alert("Impossible de récupérer votre position. Avez-vous refusé la permission GPS ?"),
                { enableHighAccuracy: true }
            );
        }

                btn.innerHTML = `Jour ${dayData.day}`;
                btn.onclick = () => selectDay(index);
                btn.id = `btn-day-${index}`;
                container.appendChild(btn);
            });
        }

        function updateDaySelector() {
            itinerary.forEach((_, index) => {

        function selectDay(index) {

            panel.classList.add('opacity-50', 'scale-[0.98]');

            setTimeout(() => {
                document.getElementById('day-date').innerText = dayData.date;
                document.getElementById('day-title').innerText = dayData.title;
                document.getElementById('day-desc').innerText = dayData.desc;

                updateDaySelector();
                renderTimeline(dayData);

                document.getElementById('timeline-list').scrollTop = 0;

            localStorage.setItem('nyc-checklist', JSON.stringify(checklist));
            selectDay(currentDayIndex);

        function renderTimeline(dayData) {

        function updateMap(dayData) {

                            <a href="https://citymapper.com/directions?endcoord=${point.coords[0]},${point.coords[1]}&endname=${encodeURIComponent(point.location)}" target="_blank" class="text-[10px] bg-white/10 hover:bg-white/20 px-1.5 py-1 rounded text-white transition-colors flex items-center gap-1"><i class="ph ph-train"></i> Citymapper</a>

                                <i class="ph ph-sparkle"></i> Conseils Photo IA ✨

                marker.bindPopup(popupContent, { closeButton: false, className: 'glass-popup', autoPanPaddingTopLeft: L.point(0, 150) });

                currentMarkers.push(marker);
                points.push(point.coords);

            if (points.length > 1) {
                L.polyline(points, { color: '#111111', weight: 3, opacity: 0.6, dashArray: '5, 10', lineCap: 'round' }).addTo(markersGroup);
            }

            if (points.length > 0) {
                const isMobile = window.innerWidth < 768;
                map.flyToBounds(markersGroup.getBounds(), { padding: isMobile ? [40, 80] : [80, 80], maxZoom: 15, duration: 1.5 });

        // --- BUDGET TRACKER LOGIC (PAR DÉPENSE UNIQUE) ---
        const budgetItems = [

        function renderBudgetTracker() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';

            budgetItems.forEach((item, index) => {
                const hasActual = item.actual !== null && item.actual !== '';
                const actualVal = hasActual ? parseFloat(item.actual) : 0;
                const diff = item.planned - actualVal;

                let diffHtml = '<span class="text-white/30">-</span>';
                if (hasActual) {
                    diffHtml = diff >= 0
                        ? `<span class="text-emerald-400">+$${diff.toFixed(2)}</span>`
                        : `<span class="text-red-400">-$${Math.abs(diff).toFixed(2)}</span>`;
                }

                const html = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between p-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-colors">
                        <div class="flex items-center gap-3 mb-2 md:mb-0 w-full md:w-1/2">
                            <div class="w-8 h-8 rounded-full bg-black/40 flex items-center justify-center shrink-0 border border-white/5">
                                <i class="ph ph-${item.cat} text-${item.color} text-lg"></i>
                            </div>
                            <span class="text-xs md:text-sm text-white font-medium truncate">${item.name}</span>
                        </div>
                        <div class="flex items-center justify-between w-full md:w-1/2 px-2 gap-4">
                            <div class="text-xs text-white/50 w-16 text-right">$${item.planned.toFixed(2)}</div>
                            <div class="relative w-24">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-white/30 text-xs">$</span>
                                <input type="number" min="0" step="0.01" value="${hasActual ? item.actual : ''}"
                                       placeholder="0.00"
                                       class="w-full bg-black/50 border border-white/20 rounded-lg pl-5 pr-2 py-1.5 text-sm text-white font-mono outline-none focus:border-emerald-400 transition-all placeholder:text-white/20"
                                       oninput="updateExpense(${index}, this.value)">
                            </div>
                            <div class="text-xs font-mono font-bold w-16 text-right" id="exp-diff-${index}">${diffHtml}</div>
                        </div>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', html);
            });
            updateBudgetTotals();
        }

        function updateExpense(index, value) {
            budgetItems[index].actual = value;

            // Mise à jour visuelle du différentiel local sans perdre le focus
            const diffSpan = document.getElementById(`exp-diff-${index}`);
            if (value === null || value === '') {
                diffSpan.innerHTML = '<span class="text-white/30">-</span>';
            } else {
                const diff = budgetItems[index].planned - parseFloat(value);
                diffSpan.innerHTML = diff >= 0
                    ? `<span class="text-emerald-400">+$${diff.toFixed(2)}</span>`
                    : `<span class="text-red-400">-$${Math.abs(diff).toFixed(2)}</span>`;
            }

            updateBudgetTotals();
        }

        function updateBudgetTotals() {
            let totalPlanned = 0;
            let totalSpent = 0;
            let diffOnPaid = 0;

            budgetItems.forEach(item => {
                totalPlanned += item.planned;
                if (item.actual !== null && item.actual !== '') {
                    const actual = parseFloat(item.actual) || 0;
                    totalSpent += actual;
                    diffOnPaid += (item.planned - actual);
                }
            });

            const remaining = totalPlanned - totalSpent;

            document.getElementById('b-planned').innerText = `$${totalPlanned.toFixed(2)}`;
            document.getElementById('b-spent').innerText = `$${totalSpent.toFixed(2)}`;
            document.getElementById('b-rem').innerText = `$${remaining.toFixed(2)}`;

            const diffEl = document.getElementById('b-diff');
            if (diffOnPaid === 0) {
                diffEl.innerText = "$0.00";
                diffEl.className = "text-lg md:text-xl font-mono font-bold text-white/50 transition-colors";
            } else if (diffOnPaid > 0) {
                diffEl.innerText = `+$${diffOnPaid.toFixed(2)}`;
                diffEl.className = "text-lg md:text-xl font-mono font-bold text-emerald-400 transition-colors";
            } else {
                diffEl.innerText = `-$${Math.abs(diffOnPaid).toFixed(2)}`;
                diffEl.className = "text-lg md:text-xl font-mono font-bold text-red-400 transition-colors";
            }
        }

        function toggleBudgetModal() {
            const modal = document.getElementById('budget-modal');
            const content = modal.querySelector('.modal-content-anim');

            if (modal.classList.contains('modal-hidden')) {
                renderBudgetTracker();
                modal.classList.remove('modal-hidden');
                setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
            } else {
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modal.classList.add('modal-hidden'), 300);
            }
        }

        // --- INIT ---
        window.onload = initApp;
    </script>
</body>

</html>
